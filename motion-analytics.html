.pattern-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--pattern-tint);opacity:var(--pattern-op);-webkit-mask-image:var(--pat);mask-image:var(--pat);-webkit-mask-size:1100px auto;mask-size:1100px auto;-webkit-mask-repeat:repeat;mask-repeat:repeat}
.side::after,.kc.feature::after,.rep-band::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:#fff;opacity:var(--side-pattern-op);-webkit-mask-image:var(--pat);mask-image:var(--pat);-webkit-mask-size:700px auto;mask-size:700px auto}
.side::after{position:fixed;width:236px;right:auto;background:#000;opacity:.07}
.kc.feature,.rep-band{position:relative;isolation:isolate;overflow:hidden}
.kc.feature::after{-webkit-mask-size:420px auto;mask-size:420px auto;background:#000;opacity:.08}
.rep-band{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:14px;background:var(--red-deep);color:#fff;margin-bottom:22px}
.rep-band .lg{flex:none;filter:drop-shadow(0 3px 8px rgba(60,0,0,.35))}.rep-band .lg img{display:block;height:44px;width:auto}
.rep-band .t{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25}.rep-band .s{color:#FFE3E4}
h1,h2,h3,h4,.kc .val,.score b,.top h1{font-family:var(--display)}
.top h1{font-weight:700;letter-spacing:-.01em}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);isolation:isolate;color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--side-bg);isolation:isolate;color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:block;padding:0 4px 16px;color:#fff;text-align:center}.brand-logo{display:block;padding:2px 4px;filter:drop-shadow(0 4px 10px rgba(60,0,0,.35))}.brand-logo img{display:block;width:100%;height:auto}.brand-sub{display:block;margin-top:10px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.01em;color:#fff}.brand-sub small{display:block;font-family:var(--font);font-weight:500;font-size:11px;color:var(--side-fg);letter-spacing:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--orange);display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:-.01em;font-weight:800}
.brand small{display:block;font-size:11px;color:var(--side-fg);font-weight:500;margin-top:-2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.nav a.on{background:#fff;color:var(--side-active);font-weight:600;box-shadow:0 2px 8px rgba(80,0,0,.18)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--yellow)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.side-foot{margin-top:auto;font-size:12px;padding:12px 10px 0;color:var(--side-fg);border-top:1px solid rgba(255,255,255,.18)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.015em}
.top .grow{flex:1}
.btn.menu-btn{display:none}
.content{padding:24px 28px 60px;max-width:1440px;width:100%}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px}
.banner.sample{background:var(--yellow-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--yellow) 60%,transparent)}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
/* filter bar */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button.on{background:var(--navy);color:#fff}

select,input[type=text],input[type=number],input[type=month],input[type=date],input[type=url],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}

.btn.accent{background:var(--yellow);border-color:var(--yellow);color:#1A1A1A}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;min-height:28px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
/* panels */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.kc[hidden]{display:none}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:15px;margin:0;font-weight:700}
.panel-h p{margin:0;color:var(--muted);font-size:12.5px;width:100%}
.panel-h .sp{flex:1}
.panel-b{padding:16px 18px}
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px}
/* kpi card */
.kc{padding:15px 16px 14px;display:flex;flex-direction:column;gap:4px;position:relative}
.kc .lbl{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:5px}
.kc .val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kc .val.nd{color:var(--faint);font-size:22px}
.kc .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kc.feature{background:var(--red-deep);color:#fff;border-color:var(--red-deep)}
.kc.feature .lbl,.kc.feature .sub{color:#FFE3E4}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:12px;padding:1px 6px;border-radius:5px}
.delta.up{color:var(--ok);background:var(--ok-bg)}.delta.down{color:var(--bad);background:var(--bad-bg)}.delta.flat{color:var(--nd);background:var(--nd-bg)}
.kc.feature .delta{background:rgba(255,255,255,.95)}.kc.feature .delta.up{color:#14804A}.kc.feature .delta.down{color:#C8141B}.kc.feature .delta.flat{color:#6F6767}
/* tooltip */
.tip{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid currentColor;font-size:10px;font-weight:700;cursor:help;opacity:.6;flex:none}
.tip:hover,.tip:focus{opacity:1}

<script>
// ===== Motion Analytics calculation engine =====
// Rule: missing data is null, never 0. Any formula with a missing input or a zero denominator returns null.
var Calc = (function () {
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/[,\s₵$GHgh]/g, '').replace(/%$/, '');
    if (s === '' || s === '-') return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function div(a, b) { a = num(a); b = num(b); if (a === null || b === null || b === 0) return null; return a / b; }
  function pct(a, b) { var d = div(a, b); return d === null ? null : d * 100; }
  // Sum that ignores nulls; null if every value is null.
  function sum(arr) { var t = null; for (var i = 0; i < arr.length; i++) { var v = num(arr[i]); if (v !== null) t = (t === null ? 0 : t) + v; } return t; }

  var ENG = ['likes', 'comments', 'shares', 'saves'];
  // 'matched' (default): ER denominators only include reach from records that also have engagement data.
  // 'all': every reported reach figure is in the denominator (matches the monthly report method).
  var mode = { er: 'matched' };
  // A platform-reported total (e.g. Meta "interactions", X "engagements") overrides the sum of components.
  function engagements(r) { if (r._eng !== undefined) return r._eng; var rep = num(r.engagementsReported); if (rep !== null) return rep; return sum(ENG.map(function (k) { return r[k]; })); }
  function reachDen(r) { return (mode.er === 'matched' && r._erReachDen !== undefined) ? r._erReachDen : num(r.reach); }
  function netFollowers(r) { var o = num(r.openFollowers), c = num(r.closeFollowers); return (o === null || c === null) ? null : c - o; }
  function followerGrowth(r) { var n = netFollowers(r); return n === null ? null : pct(n, r.openFollowers); }
  function erReach(r) { return pct(engagements(r), reachDen(r)); }
  function erFollowers(r) { return pct(engagements(r), r.closeFollowers); }
  function momGrowth(cur, prev) { cur = num(cur); prev = num(prev); if (cur === null || prev === null || prev === 0) return null; return (cur - prev) / Math.abs(prev) * 100; }

  // KPI achievement. direction 'higher' (default) or 'lower'.
  // For rate targets that can go negative (growth %), achievement is still actual/target.
  function achievement(actual, target, direction) {
    actual = num(actual); target = num(target);
    if (actual === null || target === null || target === 0) return null;
    if (direction === 'lower') { if (actual === 0) return null; return target / actual * 100; }
    return actual / target * 100;
  }
  function kpiStatus(actual, target, direction, nearPct) {
    if (num(actual) === null) return 'No Data';
    var a = achievement(actual, target, direction);
    if (a === null) return 'No Data';
    var near = num(nearPct); if (near === null) near = 90;
    if (a >= 100) return 'Target Achieved';
    if (a >= near) return 'Near Target';
    return 'Below Target';
  }

  // ---- record selection ----
  // Avoid double counting: per platform+month, a 'total' record wins; otherwise organic + paid are combined.
  function effective(records, scopeFilter) {
    if (scopeFilter === 'organic' || scopeFilter === 'paid') return records.filter(function (r) { return (r.scope || 'total') === scopeFilter; });
    var groups = {};
    records.forEach(function (r) { var k = r.platformId + '|' + r.month; (groups[k] = groups[k] || []).push(r); });
    var out = [];
    Object.keys(groups).forEach(function (k) {
      var g = groups[k];
      var tot = g.filter(function (r) { return (r.scope || 'total') === 'total'; });
      if (tot.length) out.push(tot[0]);
      else out.push(combine(g));
    });
    return out;
  }
  var SUMMABLE = ['reach', 'impressions', 'videoViews', 'profileVisits', 'likes', 'comments', 'shares', 'saves', 'engagementsReported', 'linkClicks', 'posts', 'stories', 'adSpend', 'newFollowers'];
  function combine(g) {
    var c = { platformId: g[0].platformId, month: g[0].month, scope: 'combined', combinedFrom: g.length };
    SUMMABLE.forEach(function (k) { c[k] = sum(g.map(function (r) { return r[k]; })); });
    c._eng = sum(g.map(engagements));
    c._erReachDen = sum(g.map(function (r) { return engagements(r) !== null ? r.reach : null; }));
    // followers are account-level: take from any record carrying them (same account)
    for (var i = 0; i < g.length; i++) { if (num(g[i].openFollowers) !== null && c.openFollowers == null) c.openFollowers = num(g[i].openFollowers); if (num(g[i].closeFollowers) !== null && c.closeFollowers == null) c.closeFollowers = num(g[i].closeFollowers); }
    if (c.openFollowers === undefined) c.openFollowers = null;
    if (c.closeFollowers === undefined) c.closeFollowers = null;
    return c;
  }

  // Aggregate a set of (effective) records for one period.
  function aggregate(recs) {
    var a = {};
    SUMMABLE.forEach(function (k) { a[k] = sum(recs.map(function (r) { return r[k]; })); });
    a.engagements = sum(recs.map(engagements));
    // ER by reach. 'matched': numerator and denominator only from records with BOTH figures (paid reach with no
    // engagement data is excluded). 'all': all engagements over all reported reach.
    var en = [], rd = [], ef = [], fd = [];
    recs.forEach(function (r) {
      var e = engagements(r), d = reachDen(r);
      if (mode.er === 'all') { if (e !== null) en.push(e); if (num(r.reach) !== null && num(r.reach) > 0) rd.push(r.reach); }
      else if (e !== null && d !== null && d > 0) { en.push(e); rd.push(d); }
      if (e !== null && num(r.closeFollowers) !== null && num(r.closeFollowers) > 0) { ef.push(e); fd.push(r.closeFollowers); }
    });
    if (mode.er === 'all' && !rd.length) en = [];
    a.erReach = pct(sum(en), sum(rd));
    a.erReachBase = rd.length;
    // ER by followers: engagements over end-of-month followers, per platform-month, aggregated as ratio of sums
    a.erFollowers = pct(sum(ef), sum(fd));
    a.erFollowersBase = fd.length;
    // Followers: latest closing per platform; net new = latest close - earliest open per platform (only when both exist)
    var byP = {};
    recs.forEach(function (r) { (byP[r.platformId] = byP[r.platformId] || []).push(r); });
    var closes = [], nets = [], opens = [];
    Object.keys(byP).forEach(function (p) {
      var list = byP[p].slice().sort(function (x, y) { return x.month < y.month ? -1 : 1; });
      var lastClose = null, firstOpen = null;
      for (var i = list.length - 1; i >= 0; i--) if (num(list[i].closeFollowers) !== null) { lastClose = num(list[i].closeFollowers); break; }
      for (var j = 0; j < list.length; j++) if (num(list[j].openFollowers) !== null) { firstOpen = num(list[j].openFollowers); break; }
      if (lastClose !== null) closes.push(lastClose);
      if (lastClose !== null && firstOpen !== null) { nets.push(lastClose - firstOpen); opens.push(firstOpen); }
    });
    a.followers = sum(closes);
    a.netFollowers = sum(nets);
    a.followerGrowth = pct(sum(nets), sum(opens));
    a.contentPublished = sum([a.posts, a.stories]);
    a.cpe = div(a.adSpend, a.engagements);
    a.records = recs.length;
    return a;
  }

  // Month helpers ('YYYY-MM')
  function addMonths(m, n) { var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + n; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + '-' + String(mo + 1).padStart(2, '0'); }
  function monthRange(a, b) { var out = []; if (!a || !b || a > b) return out; var m = a; while (m <= b && out.length < 600) { out.push(m); m = addMonths(m, 1); } return out; }
  function quarterOf(m) { return Math.floor((+m.slice(5, 7) - 1) / 3) + 1; }
  // filter: {mode, month, quarter:'2026-Q3', year:'2026', from, to}
  function periodMonths(f) {
    if (f.mode === 'quarter') { var y = f.quarter.slice(0, 4), q = +f.quarter.slice(6); var s = y + '-' + String((q - 1) * 3 + 1).padStart(2, '0'); return monthRange(s, addMonths(s, 2)); }
    if (f.mode === 'year') return monthRange(f.year + '-01', f.year + '-12');
    if (f.mode === 'custom') return monthRange(f.from, f.to);
    return [f.month];
  }
  function previousPeriod(f) {
